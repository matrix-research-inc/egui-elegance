[package]
name = "egui-elegance"
version = "0.17.3"
edition = "2024"
rust-version = "1.95"
authors = ["Stephen Berry"]
description = "Elegant, opinionated widgets for egui: buttons, inputs, selects, cards, tabs and more. Paired dark/light themes."
license = "MIT OR Apache-2.0"
repository = "https://github.com/matrix-research-inc/egui-elegance"
readme = "README.md"
keywords = ["egui", "gui", "ui", "theme", "widgets"]
categories = ["gui"]
exclude = [
    ".cargo/",
    ".github/",
    ".gitignore",
    "CONTRIBUTING.md",
    "dev/",
    "docs/images/",
    "mockups/",
    "tests/snapshots/",
    "tests/visual.rs",
]

[package.metadata.docs.rs]
# Document the `serde`-gated API too.
all-features = true

[lib]
name = "elegance"
path = "src/lib.rs"

[lints.rust]
warnings = "deny"

[features]
# Derive `Serialize`/`Deserialize` for `DockLayout` so apps can persist it.
serde = ["dep:serde"]

[dependencies]
egui = "0.37"
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
# egui 0.37 no longer bundles emoji fonts by default; the examples and
# snapshot fixtures use a few as decorative icons.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[[example]]
name = "orbit"
path = "examples/orbit.rs"

[[example]]
name = "widgets"
path = "examples/widgets.rs"

[[example]]
name = "render_docs"
path = "examples/render_docs.rs"
